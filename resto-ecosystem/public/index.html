<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RestoOS — Luxury Dining Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0a0a0a] text-[#f5f5f7] font-sans min-h-screen p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center border-b border-[#222] pb-4">
      <h1 class="text-sm font-bold tracking-widest text-[#c5a059] uppercase">RestoOS Luxury Dining</h1>
      <div class="flex items-center space-x-3">
        <span id="table-display" class="text-xs font-mono bg-[#121212] border border-[#222] px-3 py-1.5 rounded text-[#aaa]">Table: Loading...</span>
        <button onclick="openTracker()" class="bg-[#121212] border border-[#333] hover:border-[#c5a059] text-xs font-bold px-4 py-1.5 rounded uppercase tracking-wider text-[#f5f5f7]">Track Orders</button>
      </div>
    </div>

    <!-- Menu Grid -->
    <div id="menu-container" class="grid grid-cols-2 gap-4">
      <p class="text-xs text-[#666]">Loading menu catalog...</p>
    </div>

    <!-- Cart Summary Bar -->
    <div class="bg-[#121212] border border-[#222] p-4 rounded flex justify-between items-center">
      <div>
        <p class="text-[10px] uppercase tracking-widest text-[#888]">Current Cart Total</p>
        <p id="cart-total" class="text-lg font-mono font-bold text-[#c5a059]">$0.00</p>
      </div>
      <button onclick="placeOrder()" class="bg-[#c5a059] text-[#0a0a0a] text-xs font-bold px-6 py-2.5 rounded uppercase tracking-wider transition hover:bg-[#b08d48]">Place Order</button>
    </div>
  </div>

  <!-- Customer Order Tracker Modal (Session-Filtered) -->
  <div id="tracker-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-[#121212] border border-[#222] w-full max-w-lg p-6 rounded-lg space-y-4 max-h-[80vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-[#222] pb-3">
        <h3 class="text-xs font-bold tracking-widest text-[#c5a059] uppercase">Your Session Order History</h3>
        <button onclick="openTracker()" class="text-[#888] hover:text-white">✕</button>
      </div>
      <div id="order-tracker-list" class="space-y-3">
        <p class="text-xs text-[#666]">No active orders for this session.</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hbhbmadlsfhodardcwsf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Dpdbob-sDqzyKiA5NS3_dA_DkchtJdu';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- UNIQUE CUSTOMER SESSION INITIALIZATION ---
    let customerSessionId = localStorage.getItem('resto_session_id');
    if (!customerSessionId) {
      customerSessionId = 'sess_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36);
      localStorage.setItem('resto_session_id', customerSessionId);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const tableId = urlParams.get('table') || 'Table-4';
    document.getElementById('table-display').innerText = `Table: ${tableId}`;

    let cart = [];
    let menuCache = [];

    async function loadMenu() {
      const { data: menu } = await supabaseClient.from('menu').select('*').eq('is_available', true);
      menuCache = menu || [];
      const container = document.getElementById('menu-container');

      if (menuCache.length === 0) {
        container.innerHTML = '<p class="text-xs text-[#666]">No menu items available right now.</p>';
        return;
      }

      container.innerHTML = menuCache.map(item => `
        <div class="bg-[#121212] border border-[#222] p-4 rounded flex justify-between items-center">
          <div>
            <p class="font-bold text-xs text-[#f5f5f7]">${item.name}</p>
            <p class="text-[10px] text-[#888] mt-0.5">${item.description || ''}</p>
            <p class="font-mono text-xs text-[#c5a059] mt-2">$${item.price.toFixed(2)}</p>
          </div>
          <button onclick="addToCart('${item.id}')" class="border border-[#333] hover:border-[#c5a059] text-xs font-bold px-3 py-1.5 rounded uppercase tracking-wider text-[#f5f5f7]">+ Add</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = menuCache.find(i => i.id === id);
      if (!item) return;
      const existing = cart.find(i => i.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
      }
      updateCartTotal();
    }

    function updateCartTotal() {
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    async function placeOrder() {
      if (cart.length === 0) return alert('Your cart is empty.');
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const { error } = await supabaseClient.from('orders').insert([{
        table_id: tableId,
        session_id: customerSessionId, // Binds order strictly to this browser session
        items: cart,
        total_amount: total,
        status: 'NEW',
        payment_status: 'UNPAID'
      }]);

      if (error) {
        alert('Order failed: ' + error.message);
      } else {
        alert('Order successfully placed to kitchen.');
        cart = [];
        updateCartTotal();
        loadCustomerTracking();
      }
    }

    function openTracker() {
      const modal = document.getElementById('tracker-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        loadCustomerTracking();
      }
    }

    async function loadCustomerTracking() {
      // Query orders matching THIS specific table AND THIS specific session ID
      const { data: orders } = await supabaseClient
        .from('orders')
        .select('*')
        .eq('table_id', tableId)
        .eq('session_id', customerSessionId)
        .order('created_at', { ascending: false });

      const container = document.getElementById('order-tracker-list');

      if (!orders || orders.length === 0) {
        container.innerHTML = `<p class="text-xs text-[#666] text-center py-4">No active orders for your session.</p>`;
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="bg-[#0a0a0a] border border-[#222] p-3 rounded space-y-2 text-xs">
          <div class="flex justify-between font-mono">
            <span class="text-[#c5a059] font-bold">#${o.id.slice(0,6)}</span>
            <span class="text-emerald-400">STATUS: ${o.status}</span>
          </div>
          <p class="text-[#ddd]">${o.items.map(i => `${i.qty}x ${i.name}`).join(', ')}</p>
          <div class="flex justify-between text-[10px] text-[#888] pt-1 border-t border-[#222]">
            <span>Payment: ${o.payment_status}</span>
            <span class="font-mono font-bold text-white">$${o.total_amount.toFixed(2)}</span>
          </div>
        </div>
      `).join('');
    }

    loadMenu();
  </script>
</body>
</html>
